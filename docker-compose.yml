version: '3'
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data # Persistent data for Zookeeper
      - zookeeper_log:/var/lib/zookeeper/log   # Transaction logs for Zookeeper
    networks:
      - my_app_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://192.168.2.21:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    depends_on:
      - zookeeper
    networks:
      - my_app_network

  # --- Add the Kafka-UI service below ---
  kafka-ui:
    image: provectuslabs/kafka-ui:latest # Or specify a stable version like v0.7.2
    container_name: kafka-ui
    ports:
      - "8080:8080" # Map host port 8080 to container port 8080 for the UI
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: LocalKafkaCluster # Name that will appear in the UI
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092 # How Kafka-UI connects to Kafka *within the Docker network*
      # KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181 # Optional: Use if you need Zookeeper connection for specific UI features
      DYNAMIC_CONFIG_ENABLED: "true" # Allows dynamic changes to UI configuration (e.g., add more clusters from UI)
    depends_on:
      - kafka # Ensure Kafka is running before Kafka-UI starts
    networks:
      - my_app_network

  # ------ config-server -------
  config-server:
    image: compratap/jfd-config-server:0.0.1-SNAPSHOT
    container_name: config-server
    ports:
      - "8888:8888"
    restart: unless-stopped
    networks:
      - my_app_network

  # ------ registry -------
  jfd-registry:
    image: compratap/jfd-registry:0.0.1-SNAPSHOT
    container_name: jfd-registry
    ports:
      - "8761:8761"
    restart: unless-stopped
    depends_on:
      - config-server
    networks:
      - my_app_network

  # ------ worker-mgmt -------
  worker-mgmt:
    image: compratap/jfd-worker-mgmt:0.0.1-SNAPSHOT
    container_name: worker-mgmt
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - my_app_network

networks:
  my_app_network:
    driver: bridge

volumes:
  zookeeper_data: # New named volume for Zookeeper data
  zookeeper_log:  # New named volume for Zookeeper transaction logs
